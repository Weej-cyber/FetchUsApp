name: FetchUs UAT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uat:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify environment
        run: |
          echo "=== Checking app URL ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://fetchus.vercel.app)
          echo "fetchus.vercel.app HTTP status: $STATUS"

          echo "=== Checking Supabase ==="
          SUPA=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_eXLygIqAXfuXO6dYHwz0pA_iSC0dec4" \
            https://rwauwkrdzcesyhwpaeow.supabase.co/rest/v1/)
          echo "Supabase REST status: $SUPA"

          echo "=== Checking test user auth ==="
          AUTHRESP=$(curl -s -X POST \
            -H "apikey: sb_publishable_eXLygIqAXfuXO6dYHwz0pA_iSC0dec4" \
            -H "Content-Type: application/json" \
            -d '{"email":"fetchusadmin@test.com","password":"FetchTest1!"}' \
            "https://rwauwkrdzcesyhwpaeow.supabase.co/auth/v1/token?grant_type=password")
          echo "$AUTHRESP" | grep -q "access_token" && echo "Auth: OK" || echo "Auth: FAILED -- $AUTHRESP"

          if [ "$STATUS" != "200" ] && [ "$STATUS" != "301" ] && [ "$STATUS" != "302" ]; then
            echo "ENV_CHECK_FAILED: App returned $STATUS" > /tmp/env_status.txt
            exit 1
          fi
          echo "ENV_CHECK_PASSED" > /tmp/env_status.txt
          echo "=== All checks passed ==="

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: uat
        run: npm install

      - name: Install Playwright Chromium
        working-directory: uat
        run: npx playwright install chromium --with-deps

      - name: Run UAT
        working-directory: uat
        env:
          SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3YXV3a3JkemNlc3lod3BhZW93Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2OTgwODIyNywiZXhwIjoyMDg1Mzg0MjI3fQ.bRMPmKnuhdlxYBnS65bpmzUo2fciyuscGfgCH2_siPc
        run: node uat.js
        continue-on-error: true

      - name: Commit results
        if: always()
        run: |
          git config user.email "uat@fetchusapp.com"
          git config user.name "FetchUs UAT"
          if [ -f /tmp/env_status.txt ]; then
            cat /tmp/env_status.txt > uat-results.txt
          elif [ -f uat/uat-results.txt ]; then
            cp uat/uat-results.txt uat-results.txt
          else
            echo "No results file produced" > uat-results.txt
          fi
          git add uat-results.txt
          git diff --staged --quiet || git commit -m "UAT results $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Weej-cyber/FetchUsApp.git" main
