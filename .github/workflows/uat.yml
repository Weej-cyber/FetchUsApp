name: FetchUs UAT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  uat:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: uat
        run: npm install

      - name: Install Playwright Chromium
        working-directory: uat
        run: npx playwright install chromium --with-deps

      - name: Run UAT
        working-directory: uat
        env:
          SUPABASE_SERVICE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ3YXV3a3JkemNlc3lod3BhZW93Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2OTgwODIyNywiZXhwIjoyMDg1Mzg0MjI3fQ.bRMPmKnuhdlxYBnS65bpmzUo2fciyuscGfgCH2_siPc
        run: node uat.js
        continue-on-error: true

      - name: Commit results
        run: |
          git config user.email "uat@fetchusapp.com"
          git config user.name "FetchUs UAT"
          cp uat/uat-results.txt uat-results.txt 2>/dev/null || echo "No results file" > uat-results.txt
          git add uat-results.txt
          git diff --staged --quiet || git commit -m "UAT results $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Weej-cyber/FetchUsApp.git" main
